version: "3.9"

# FinReg10K Docker Compose
#
# Reuses the same Neo4j, Qdrant, and PostgreSQL services as finwiki-kg
# (shared cluster — both corpora ingest into the same graph).
#
# Options:
#   1. Run standalone (this file starts its own DB stack):
#      docker-compose -f finreg10k-kg/docker-compose.yml up
#
#   2. Run alongside finwiki-kg (share running DB services):
#      Start finwiki-kg stack first, then run finreg10k-pipeline service
#      against the finwiki-net network using the override file.
#
# The finreg10k-pipeline service uses FINWIKI_KG_PATH to locate the
# existing pipeline code — no duplication required.

networks:
  finwiki-net:
    # Reference the external network created by the finwiki-kg stack,
    # or create a new one if running standalone.
    external: false
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:

services:

  # ── Shared infrastructure (mirrors finwiki-kg docker-compose.yml) ──────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB:       finwiki
      POSTGRES_USER:     finwiki
      POSTGRES_PASSWORD: finwiki
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../finwiki-kg/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - finwiki-net
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U finwiki -d finwiki"]
      interval: 10s
      timeout:  5s
      retries:  5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - finwiki-net
    healthcheck:
      test:     ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH:                      neo4j/finwiki123
      NEO4J_PLUGINS:                   '["apoc"]'
      NEO4J_apoc_export_file_enabled:  "true"
      NEO4J_apoc_import_file_enabled:  "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - ../finwiki-kg/cypher/schema.cypher:/var/lib/neo4j/import/schema.cypher
    networks:
      - finwiki-net
    healthcheck:
      test:     ["CMD-SHELL", "cypher-shell -u neo4j -p finwiki123 'RETURN 1' || exit 1"]
      interval: 15s
      timeout:  10s
      retries:  10

  # ── FinReg10K pipeline service ─────────────────────────────────────────────
  finreg10k-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      FINWIKI_KG_PATH:  /finwiki-kg
      POSTGRES_URL:     postgresql://finwiki:finwiki@postgres:5432/finwiki
      QDRANT_URL:       http://qdrant:6333
      NEO4J_URL:        bolt://neo4j:7687
      NEO4J_USER:       neo4j
      NEO4J_PASSWORD:   finwiki123
      COST_CEILING_USD: "9.50"
      LOG_LEVEL:        INFO
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ../finwiki-kg:/finwiki-kg:ro    # read-only mount of shared pipeline code
    networks:
      - finwiki-net
    # Default: run the full pipeline. Override CMD for specific stages:
    #   docker-compose run finreg10k-pipeline python run_pipeline.py --skip-acquire
    command: ["python", "run_pipeline.py"]
